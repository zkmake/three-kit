    <script>
      // Resolve the stored theme before first paint so the page doesn't flash.
      // main.ts takes over from here; the key and the values match what it uses.
      try {
        var mode = localStorage.getItem("three-meter-example:theme") || "system";
        var dark =
          mode === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : mode === "dark";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (_) {}
    </script>
