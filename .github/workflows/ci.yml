name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run ci:format
      - run: bun run ci:lint
      - run: bun run ci:typecheck
      - run: bun run ci:test
      # Packages and apps; turbo orders them by dependency.
      - run: bun run build
      - run: bun run pack:check
      # The site as built for zubin.dev/three-kit/, for the `site` job to publish.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/site/dist
          retention-days: 1

  # zubin.dev serves the site at /three-kit/: its deploy downloads `site.tar.gz` from the rolling
  # `site` release. Publish it once checks pass on main, then ask zubin.dev to redeploy.
  site:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      # The site's files at the tarball's root, no top folder.
      - run: tar -czf site.tar.gz -C dist .
      - name: Upload to the `site` release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view site >/dev/null 2>&1; then
            gh release create site --target "$GITHUB_SHA" --latest=false \
              --title "Site build" \
              --notes "The three-kit site as built for zubin.dev/three-kit/, replaced on every push to main. Not a package release."
          fi
          gh release upload site site.tar.gz --clobber
      - name: Ask zubin.dev to redeploy
        env:
          GH_TOKEN: ${{ secrets.ZUBIN_DEV_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ZUBIN_DEV_DISPATCH_TOKEN isn't set, so zubin.dev won't redeploy until its own next build."
            exit 0
          fi
          gh api repos/zkmake/zubin.dev/dispatches -f event_type=three-kit-site
