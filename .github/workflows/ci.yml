name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run ci:format
      - run: bun run ci:lint
      - run: bun run ci:typecheck
      - run: bun run ci:test
      # Packages and apps; turbo orders them by dependency.
      - run: bun run build
      - run: bun run pack:check
